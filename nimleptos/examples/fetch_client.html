<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NimLeptos Fetch Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    #app { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .fetch-status { color: #666; font-style: italic; }
    .post-list { list-style: none; padding: 0; }
    .post-item { padding: 12px; border-bottom: 1px solid #eee; }
    .post-item strong { display: block; margin-bottom: 4px; color: #333; }
    .post-item p { margin: 0; color: #555; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; background: #4a90d9; color: white; cursor: pointer; }
    .btn:hover { background: #357abd; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="fetch_client.js"></script>
</body>
</html>
