<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NimLeptos Form Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    #app { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { display: block; margin: 15px 0 5px; font-weight: 500; color: #333; }
    .form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    textarea.form-input { min-height: 100px; resize: vertical; }
    .error-list { color: #c33; margin: 10px 0; padding-left: 20px; }
    .btn { margin-top: 15px; padding: 10px 20px; border: none; border-radius: 6px; background: #4a90d9; color: white; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #357abd; }
    .success-msg { color: #2a2; font-weight: 500; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="form_client.js"></script>
</body>
</html>
