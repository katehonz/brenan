<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NimLeptos Router Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    #app { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .router-nav { margin-bottom: 20px; }
    .router-nav a { display: inline-block; margin-right: 15px; text-decoration: none; color: #4a90d9; font-weight: 500; }
    .router-nav a:hover { text-decoration: underline; }
    .route-display { color: #888; font-size: 0.9rem; margin-bottom: 15px; }
    .router-content { padding-top: 10px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="router_client.js"></script>
</body>
</html>
